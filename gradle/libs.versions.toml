[versions]
agp = "8.10.0"
kotlin = "2.1.20"
datetime = "0.6.1"

ktor = "2.3.12"
compose = "1.7.8"
coroutines = "1.9.0"
# 💬 31-Aug-2026 chat: the version ktor-client-okhttp 2.3.12 already resolves, pinned so the
# websocket and the http client cannot drift onto two different okhttp copies
okhttp = "4.12.0"
coil = "2.7.0"
compose-material3 = "1.3.1"
compose-material3-icons= "1.7.8"
androidx-activityCompose = "1.9.3"
navigationCompose = "2.8.9"
viewmodelCompose = "2.8.7"
datastore = "1.1.3"
compiler = "3.2.0-alpha11"
koin = "4.0.0"
sqldelight ="2.0.2"
media3= "1.5.1"
camerax  ="1.4.1"
coreKtx = "1.15.0"
junit = "4.13.2"
junitVersion = "1.2.1"
espressoCore = "3.6.1"
appcompat = "1.7.0"
constraintlayout = "2.2.1"
playServicesLocation = "21.3.0"
workRuntimeKtx = "2.10.2"
animation = "1.10.0"
google-services = "4.5.0"
firebase-bom = "34.16.0"

firebase-crashlytics-plugin = "3.0.7"
material3 = "1.4.0"
kotlinStdlib = "2.1.20"
# 🔧 30-Jul-2026 02:10 explicit serialization runtime: :core:model/:core:network no longer inherit it via the ktor bundle
serializationJson = "1.7.3"
runner = "1.7.0"
core = "1.7.0"
leakcanary = "1.0.0"
[libraries]

#compose
coil = { module = "io.coil-kt:coil-compose", version.ref= "coil" }
coil-svg = {module = "io.coil-kt:coil-svg", version.ref= "coil" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activityCompose" }
compose-ui = { module = "androidx.compose.ui:ui", version.ref = "compose" }
compose-viewmodel= {module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "viewmodelCompose"}
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling", version.ref = "compose" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview", version.ref = "compose" }
compose-foundation = { module = "androidx.compose.foundation:foundation", version.ref = "compose" }
compose-material3 = { module = "androidx.compose.material3:material3", version.ref = "compose-material3" }
compose-material3-icons = { module = "androidx.compose.material:material-icons-extended", version.ref = "compose-material3-icons" }

#media-android
media3-session = {module = "androidx.media3:media3-session", version.ref = "media3"}
media3-exoplayer = {module = "androidx.media3:media3-exoplayer", version.ref= "media3"}
media3-ui= {module = "androidx.media3:media3-ui", version.ref= "media3"}

#Ktor
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktor-client-darwin = { module = "io.ktor:ktor-client-darwin", version.ref = "ktor" }
ktor-client-logging = {module = "io.ktor:ktor-client-logging", version.ref = "ktor"}
ktor-client-content-negotiation = {module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor"}
ktor-serialization-kotlinx-json = {module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor"}
ktor-client-auth = {module = "io.ktor: ktor-client-auth", version.ref = "ktor" }
#kotlin
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
# 💬 websocket engine for the Android side of the chat socket
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
kotlinx-datetime={module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "datetime"}
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serializationJson" }
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose" , version.ref = "navigationCompose" }
 #DI
koin-android ={ module ="io.insert-koin:koin-android", version.ref = "koin"}
koin-jvm = { module ="io.insert-koin:koin-core-jvm", version.ref = "koin"}
koin = { module ="io.insert-koin:koin-core", version.ref = "koin"}
koin-compose ={ module ="io.insert-koin:koin-androidx-compose", version.ref = "koin"}

#datastore
datastore-preferences= { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }
datastore= { module = "androidx.datastore:datastore", version.ref = "datastore" }
androidx-compiler = { group = "androidx.databinding", name = "compiler", version.ref = "compiler" }

#sqldelight
sqldelight-android = {module = "app.cash.sqldelight:android-driver", version.ref = "sqldelight"}
sqldelight-native = {module = "app.cash.sqldelight:native-driver", version.ref = "sqldelight"}

#Camerax
android-camerax-core = {module = "androidx.camera:camera-core", version.ref = "camerax"}
android-camerax-camera2 = {module = "androidx.camera:camera-camera2", version.ref = "camerax"}
android-camerax-lifecycle = {module = "androidx.camera:camera-lifecycle", version.ref = "camerax"}
android-camerax-video = {module = "androidx.camera:camera-video", version.ref = "camerax"}
android-camerax-camera-view = {module = "androidx.camera:camera-view", version.ref = "camerax"}
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
androidx-constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "constraintlayout" }
#Location
play-services-location = { group = "com.google.android.gms", name = "play-services-location", version.ref = "playServicesLocation" }
androidx-work-runtime-ktx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "workRuntimeKtx" }
androidx-animation = { group = "androidx.compose.animation", name = "animation", version.ref = "animation" }
# firebase
firebase-bom = { module = "com.google.firebase:firebase-bom", version.ref = "firebase-bom" }
firebase-crashlytics = { module = "com.google.firebase:firebase-crashlytics" }
androidx-material3 = { group = "androidx.compose.material3", name = "material3", version.ref = "material3" }
kotlin-stdlib = { group = "org.jetbrains.kotlin", name = "kotlin-stdlib", version.ref = "kotlinStdlib" }
androidx-runner = { group = "androidx.test", name = "runner", version.ref = "runner" }
androidx-core = { group = "androidx.test", name = "core", version.ref = "core" }
leakcanary = { group = "com.android.tools.studio.leakcanary", name = "leakcanary", version.ref = "leakcanary" }
[plugins]
androidApplication = { id = "com.android.application", version.ref = "agp" }
androidLibrary = { id = "com.android.library", version.ref = "agp" }
kotlinAndroid = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = {id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin"}
sqldelight = {id = "app.cash.sqldelight", version.ref = "sqldelight"}
google-services = { id = "com.google.gms.google-services", version.ref = "google-services" }
firebase-crashlytics = { id = "com.google.firebase.crashlytics", version.ref = "firebase-crashlytics-plugin" }
android-kotlin-multiplatform-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
android-lint = { id = "com.android.lint", version.ref = "agp" }
[bundles]
ktor = [
    "ktor-client-core",
    "ktor-client-auth",
    "ktor-client-logging",
    "ktor-client-content-negotiation",
    "ktor-serialization-kotlinx-json",
]
koinAndroid = [
    "koin-android",
    "koin-compose"
]
media3= [
    "media3-session",
    "media3-exoplayer",
    "media3-ui"
]
camerax = [
    "android-camerax-camera-view",
    "android-camerax-core",
    "android-camerax-lifecycle",
    "android-camerax-video",
    "android-camerax-camera2",
]
material3 =[
    "compose-material3",
    "compose-material3-icons"
]